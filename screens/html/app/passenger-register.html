<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* just to see the mobile frame clearly */
        }
    </style>
</head>
<body>

    <div class="max-w-[400px] mx-auto min-h-screen bg-white shadow-2xl relative overflow-hidden">
        
        <!-- Top bar -->
        <div class="px-5 py-4 flex items-center gap-3">
            <button class="w-12 h-12 bg-white border border-slate-200 rounded-xl flex items-center justify-center text-slate-600 hover:bg-slate-50 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                </svg>
            </button>
            <h1 class="font-bold text-xl text-slate-900">Passenger Registration</h1>
        </div>

        <!-- Icon -->
        <div class="w-24 h-24 bg-blue-600 rounded-2xl mx-auto mt-4 flex items-center justify-center shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-12 h-12 text-white">
                <path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM3.751 20.105a8.25 8.25 0 0116.498 0 .75.75 0 01-.437.695A18.683 18.683 0 0112 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 01-.437-.695z" clip-rule="evenodd" />
            </svg>
        </div>

        <!-- Form card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 mx-5 mt-6 p-6">
            
            <!-- Full Name -->
            <div>
                <label class="font-semibold text-sm text-slate-700 block">Full Name</label>
                <input type="text" placeholder="Juan Dela Cruz" class="border border-slate-200 rounded-xl px-4 py-3.5 w-full mt-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-slate-900 placeholder-slate-400">
            </div>

            <!-- Phone Number -->
            <div class="mt-5">
                <label class="font-semibold text-sm text-slate-700 block">Phone Number</label>
                <input type="tel" placeholder="+63 912 345 6789" class="border border-slate-200 rounded-xl px-4 py-3.5 w-full mt-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-slate-900 placeholder-slate-400">
            </div>

            <!-- Password -->
            <div class="mt-5">
                <label class="font-semibold text-sm text-slate-700 block">Password</label>
                <input type="password" placeholder="Create a secure password" class="border border-slate-200 rounded-xl px-4 py-3.5 w-full mt-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-slate-900 placeholder-slate-400">
            </div>

        </div>

        <!-- Terms checkbox area -->
        <div class="mx-5 mt-5 bg-slate-50 rounded-xl p-4 flex items-start gap-3 border border-slate-100">
            <input type="checkbox" id="terms" class="w-5 h-5 border-2 border-slate-300 rounded mt-0.5 text-blue-600 focus:ring-blue-500 cursor-pointer accent-blue-600">
            <label for="terms" class="text-sm text-slate-600 leading-tight cursor-pointer">
                I agree to the Terms of Service and Privacy Policy
            </label>
        </div>

        <!-- Create Account button -->
        <div class="mx-5 mt-5">
            <button class="bg-gradient-to-r from-blue-500 to-blue-600 text-white w-full rounded-2xl py-4 font-bold text-lg shadow-lg shadow-blue-200 hover:shadow-xl hover:shadow-blue-300 active:scale-[0.98] transition-all">
                Create Account
            </button>
        </div>

        <!-- Bottom -->
        <div class="text-center text-sm text-slate-600 mt-5 pb-8">
            Already have an account? <a href="#" class="text-blue-600 font-semibold hover:underline">Login</a>
        </div>

    </div>

</body>
</html>
