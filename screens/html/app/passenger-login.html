<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Login - TRIGO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* gray-100 */
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-0">

    <div class="max-w-[400px] w-full mx-auto min-h-screen sm:min-h-[800px] bg-white shadow-2xl relative overflow-hidden flex flex-col">
        
        <!-- Top Section -->
        <div class="bg-blue-600 h-[40%] min-h-[320px] relative pt-12 pb-16 px-6 flex flex-col items-center">
            <!-- Top bar -->
            <div class="w-full flex justify-between items-center mb-8">
                <button class="w-10 h-10 rounded-full bg-white/30 flex items-center justify-center text-white hover:bg-white/40 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                <span class="text-white font-medium">Passenger Login</span>
                <div class="w-10 h-10 flex items-center justify-center text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
            </div>

            <!-- Center Icon Box -->
            <div class="w-24 h-24 bg-white rounded-2xl shadow-lg flex items-center justify-center mb-4">
                <span class="text-5xl">🛺</span>
            </div>

            <!-- TRIGO Text -->
            <h1 class="text-3xl font-black text-white tracking-wider mb-1">TRIGO</h1>
            <p class="text-white/80 text-sm">Tricycle Booking System</p>
        </div>

        <!-- Bottom white section -->
        <div class="bg-white rounded-t-[40px] -mt-6 relative z-10 px-8 pt-10 pb-8 flex-1 flex flex-col">
            <h2 class="text-3xl font-black text-slate-900">Welcome Back!</h2>
            <p class="text-slate-500 text-sm mt-1 mb-6">Please login to continue</p>
            
            <form class="flex-1 flex flex-col">
                <!-- Phone Input -->
                <label class="block font-semibold text-sm text-slate-700 mb-2">Phone Number</label>
                <div class="flex gap-2 mb-5">
                    <div class="border border-slate-200 rounded-xl px-4 py-3.5 bg-slate-50 text-slate-700 font-medium w-16 text-center flex items-center justify-center shrink-0">
                        +63
                    </div>
                    <input type="tel" placeholder="912 345 6789" class="border border-slate-200 rounded-xl px-4 py-3.5 flex-1 bg-white text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600">
                </div>
                
                <!-- Password Input -->
                <label class="block font-semibold text-sm text-slate-700 mb-2">Password</label>
                <div class="relative mb-4">
                    <input type="password" value="••••••••" class="border border-slate-200 rounded-xl px-4 py-3.5 w-full bg-white text-slate-900 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 pr-12">
                    <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
                
                <!-- Remember & Forgot -->
                <div class="flex justify-between items-center mb-6">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-600 accent-blue-600">
                        <span class="text-sm text-slate-600">Remember Me</span>
                    </label>
                    <a href="#" class="text-blue-600 font-medium text-sm hover:underline">Forgot password?</a>
                </div>
                
                <!-- Spacer to push bottom items down if needed, but per design mt-6 works -->
                
                <!-- Login Button -->
                <button type="button" class="bg-blue-600 text-white w-full rounded-2xl py-4 font-bold text-lg mt-2 shadow-lg shadow-blue-200 hover:bg-blue-700 transition-colors">
                    Login
                </button>
                
                <!-- Register Link -->
                <p class="text-center text-sm mt-6 text-slate-500">
                    Don't have an account? <a href="#" class="text-blue-600 font-semibold hover:underline">Register</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
