<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help & Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="max-w-[400px] w-full mx-auto min-h-screen bg-slate-50 shadow-2xl relative overflow-hidden flex flex-col">
        <!-- Top Header -->
        <div class="bg-white px-5 pt-6 pb-4 border-b border-slate-100 sticky top-0 z-10">
            <div class="flex items-center">
                <button class="text-slate-900 text-xl font-bold w-8 text-left">✕</button>
                <h1 class="font-bold text-xl mx-auto">Help & Support</h1>
                <button class="text-blue-500 text-xl w-8 text-right">❓</button>
            </div>
            <div class="mt-4 relative">
                <span class="absolute left-3 top-3.5 text-slate-400 text-lg">🔍</span>
                <input type="text" placeholder="Search for help..." class="border border-slate-200 rounded-xl px-4 py-3 w-full pl-10 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm placeholder-slate-400 text-slate-900">
            </div>
        </div>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-4 pb-8">
            
            <!-- Contact Us Card -->
            <div class="bg-white rounded-2xl p-5 shadow-sm mb-4">
                <h2 class="font-bold text-slate-900 mb-4 text-base">Contact Us</h2>
                <div class="flex justify-between px-2">
                    <button class="flex flex-col items-center">
                        <div class="w-14 h-14 bg-blue-50 rounded-xl flex items-center justify-center text-blue-500 text-2xl mx-auto">💬</div>
                        <span class="text-xs text-center font-medium mt-1 text-slate-700">Chat</span>
                    </button>
                    <button class="flex flex-col items-center">
                        <div class="w-14 h-14 bg-emerald-50 rounded-xl flex items-center justify-center text-emerald-500 text-2xl mx-auto">📞</div>
                        <span class="text-xs text-center font-medium mt-1 text-slate-700">Call</span>
                    </button>
                    <button class="flex flex-col items-center">
                        <div class="w-14 h-14 bg-fuchsia-50 rounded-xl flex items-center justify-center text-fuchsia-500 text-2xl mx-auto">✉</div>
                        <span class="text-xs text-center font-medium mt-1 text-slate-700">Email</span>
                    </button>
                </div>
            </div>

            <!-- Hotline Banner -->
            <div class="bg-blue-600 rounded-2xl p-5 shadow-lg shadow-blue-200 mb-6 text-white relative overflow-hidden">
                <div class="relative z-10">
                    <p class="text-white/80 text-xs font-medium">24/7 Support Hotline</p>
                    <h3 class="font-black text-2xl mt-1 tracking-tight">+63 912 345 6789</h3>
                    <p class="text-white/80 text-xs mt-3 flex items-center gap-2">
                        <span class="text-sm">✉</span> support@trigo.ph
                    </p>
                    <p class="text-white/80 text-xs mt-1 flex items-center gap-2">
                        <span class="text-sm">🕐</span> Available 24 hours a day
                    </p>
                </div>
                <!-- Decorative element -->
                <div class="absolute -right-8 -bottom-8 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
            </div>

            <!-- FAQ Section -->
            <div class="mb-6">
                <h2 class="font-bold text-slate-900 mb-3 text-base">Frequently Asked Questions</h2>
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                    
                    <button class="w-full text-left p-4 border-b border-slate-100 last:border-0 relative active:bg-slate-50 transition-colors block">
                        <p class="text-blue-600 text-[10px] font-bold uppercase tracking-wider mb-1">BOOKING</p>
                        <h4 class="font-semibold text-sm text-slate-900 pr-6">How do I book a ride?</h4>
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg">›</span>
                    </button>

                    <button class="w-full text-left p-4 border-b border-slate-100 last:border-0 relative active:bg-slate-50 transition-colors block">
                        <p class="text-blue-600 text-[10px] font-bold uppercase tracking-wider mb-1">PAYMENT</p>
                        <h4 class="font-semibold text-sm text-slate-900 pr-6">What payment methods are accepted?</h4>
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg">›</span>
                    </button>

                    <button class="w-full text-left p-4 border-b border-slate-100 last:border-0 relative active:bg-slate-50 transition-colors block">
                        <p class="text-blue-600 text-[10px] font-bold uppercase tracking-wider mb-1">FARES</p>
                        <h4 class="font-semibold text-sm text-slate-900 pr-6">How is the fare calculated?</h4>
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg">›</span>
                    </button>

                    <button class="w-full text-left p-4 border-b border-slate-100 last:border-0 relative active:bg-slate-50 transition-colors block">
                        <p class="text-blue-600 text-[10px] font-bold uppercase tracking-wider mb-1">BOOKING</p>
                        <h4 class="font-semibold text-sm text-slate-900 pr-6">Can I cancel a ride?</h4>
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg">›</span>
                    </button>

                    <button class="w-full text-left p-4 border-b border-slate-100 last:border-0 relative active:bg-slate-50 transition-colors block">
                        <p class="text-blue-600 text-[10px] font-bold uppercase tracking-wider mb-1">PAYMENT</p>
                        <h4 class="font-semibold text-sm text-slate-900 pr-6">How do I top up my wallet?</h4>
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg">›</span>
                    </button>
                    
                </div>
            </div>

            <!-- Resources Section -->
            <div>
                <h3 class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">RESOURCES</h3>
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                    
                    <button class="w-full text-left p-4 border-b border-slate-100 last:border-0 flex items-center gap-3 active:bg-slate-50 transition-colors">
                        <div class="bg-blue-50 text-blue-500 w-8 h-8 rounded-lg flex items-center justify-center text-base">📄</div>
                        <span class="font-semibold text-sm text-slate-900 flex-1">User Guide</span>
                        <span class="text-slate-400 text-xl leading-none">›</span>
                    </button>

                    <button class="w-full text-left p-4 border-b border-slate-100 last:border-0 flex items-center gap-3 active:bg-slate-50 transition-colors">
                        <div class="bg-emerald-50 text-emerald-500 w-8 h-8 rounded-lg flex items-center justify-center text-base">📄</div>
                        <span class="font-semibold text-sm text-slate-900 flex-1">Safety Guidelines</span>
                        <span class="text-slate-400 text-xl leading-none">›</span>
                    </button>

                    <button class="w-full text-left p-4 border-b border-slate-100 last:border-0 flex items-center gap-3 active:bg-slate-50 transition-colors">
                        <div class="bg-fuchsia-50 text-fuchsia-500 w-8 h-8 rounded-lg flex items-center justify-center text-base">📄</div>
                        <span class="font-semibold text-sm text-slate-900 flex-1">Terms & Conditions</span>
                        <span class="text-slate-400 text-xl leading-none">›</span>
                    </button>
                    
                </div>
            </div>
            
        </div>

        <!-- Bottom nav bar -->
        <div class="bg-white border-t border-slate-200 flex justify-around py-3 mt-auto relative z-10">
            <button class="flex flex-col items-center text-emerald-600 w-16">
                <span class="text-2xl mb-1">🏠</span>
                <span class="text-[10px] font-semibold">Home</span>
            </button>
            <button class="flex flex-col items-center text-slate-400 hover:text-slate-600 transition-colors w-16">
                <span class="text-2xl mb-1">💰</span>
                <span class="text-[10px] font-medium">Earnings</span>
            </button>
            <button class="flex flex-col items-center text-slate-400 hover:text-slate-600 transition-colors w-16">
                <span class="text-2xl mb-1">👤</span>
                <span class="text-[10px] font-medium">Profile</span>
            </button>
        </div>

    </div>
</body>
</html>
