<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Active Ride</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; /* Slate 100 for background outside the app */
        }
    </style>
</head>
<body class="flex justify-center min-h-screen py-8">

    <div class="max-w-[400px] w-full mx-auto min-h-screen bg-white shadow-2xl relative overflow-hidden flex flex-col">
        
        <!-- Top map section -->
        <div class="h-[45vh] bg-gradient-to-br from-emerald-50/50 to-cyan-50/30 relative flex items-center justify-between px-10">
            <!-- Distance badge -->
            <div class="absolute top-4 left-1/2 -translate-x-1/2 bg-white rounded-2xl shadow-lg px-6 py-3 text-center z-10 flex flex-col items-center">
                <span class="text-2xl font-bold text-blue-600">1.2 km</span>
                <span class="text-sm text-slate-500">to destination</span>
            </div>

            <!-- Left side: Tricycle (You) -->
            <div class="flex flex-col items-center relative z-10">
                <div class="w-20 h-20 bg-yellow-400 rounded-full flex items-center justify-center shadow-lg text-4xl">
                    🛺
                </div>
                <span class="font-bold text-sm text-slate-700 mt-2 bg-white/80 px-2 py-0.5 rounded-full">You</span>
            </div>

            <!-- Dashed route line -->
            <div class="absolute left-[calc(50%-2.5rem)] w-[5rem] h-0 border-t-4 border-dashed border-blue-400 top-[calc(50%-1rem)] -z-0"></div>

            <!-- Right side: Pickup pin -->
            <div class="flex flex-col items-center relative z-10">
                <div class="w-16 h-16 bg-red-500 rounded-full flex items-center justify-center shadow-lg text-3xl text-white">
                    📍
                </div>
                <span class="font-bold text-sm text-slate-700 mt-2 bg-white/80 px-2 py-0.5 rounded-full">Pickup</span>
            </div>
        </div>

        <!-- Bottom sheet -->
        <div class="flex-1 bg-white rounded-t-[28px] shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.1)] p-6 relative -mt-4 z-20 flex flex-col">
            <!-- Drag handle bar -->
            <div class="w-12 h-1.5 bg-slate-300 rounded-full mx-auto mb-6"></div>

            <!-- Passenger info card -->
            <div class="bg-slate-100 rounded-2xl p-4 flex items-center gap-4">
                <div class="w-14 h-14 bg-blue-500 rounded-full flex items-center justify-center text-white text-2xl shrink-0">
                    👤
                </div>
                <div class="flex flex-col">
                    <span class="font-bold text-lg text-slate-900">Maria Santos</span>
                    <span class="text-sm text-slate-500">2 passengers</span>
                    <span class="text-sm text-slate-500 mt-0.5">Pickup: Barangay Center</span>
                </div>
            </div>

            <!-- Two action buttons -->
            <div class="grid grid-cols-2 gap-3 mt-4">
                <button class="bg-blue-600 text-white rounded-xl py-3.5 font-semibold flex items-center justify-center gap-2 shadow-sm transition-transform active:scale-95">
                    📞 Call
                </button>
                <button class="bg-emerald-500 text-white rounded-xl py-3.5 font-semibold flex items-center justify-center gap-2 shadow-sm transition-transform active:scale-95">
                    💬 Text
                </button>
            </div>

            <!-- Current fare card -->
            <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-center mt-4 flex flex-col items-center justify-center">
                <span class="text-sm text-slate-500 font-medium mb-1">Current Fare</span>
                <span class="text-4xl font-black text-emerald-700">₱47</span>
            </div>

            <div class="mt-auto pt-4">
                <!-- Arrived button -->
                <button class="bg-blue-600 text-white w-full rounded-2xl py-4 font-bold text-lg shadow-lg shadow-blue-200 flex items-center justify-center gap-2 transition-transform active:scale-95">
                    📍 Arrived
                </button>
                
                <!-- Step text -->
                <div class="text-center text-sm text-slate-400 mt-4 font-medium">
                    Step 1 of 3: Arriving at pickup location
                </div>
            </div>
        </div>

    </div>

</body>
</html>
