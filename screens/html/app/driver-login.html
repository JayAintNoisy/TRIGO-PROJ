<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Login - TRIGO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

<div class="w-full max-w-[400px] mx-auto min-h-screen sm:min-h-[812px] bg-white shadow-2xl relative overflow-hidden flex flex-col">
    <!-- Top Section -->
    <div class="bg-[#2563EB] pt-12 pb-20 px-6 relative flex flex-col items-center shrink-0">
        <!-- Header Row -->
        <div class="w-full flex items-center justify-between relative z-10">
            <!-- Back Button -->
            <button class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-md text-slate-500 hover:bg-slate-50 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                </svg>
            </button>
            
            <!-- Center Title -->
            <div class="absolute left-1/2 transform -translate-x-1/2 flex items-center gap-2 text-white font-semibold text-lg whitespace-nowrap">
                <span>🛺</span>
                <span>Driver Login</span>
            </div>
            
            <!-- Invisible placeholder for balance -->
            <div class="w-10 h-10"></div>
        </div>

        <!-- Logo Area -->
        <div class="mt-8 flex flex-col items-center relative z-10">
            <div class="w-24 h-24 bg-white rounded-2xl shadow-lg flex items-center justify-center text-5xl transform hover:scale-105 transition-transform duration-300">
                🛺
            </div>
            <h1 class="text-3xl font-black text-white tracking-wider mt-5">TRIGO</h1>
            <p class="text-white/80 text-sm mt-1">Tricycle Booking System</p>
        </div>
        
        <!-- Decorative Background Elements -->
        <div class="absolute top-0 right-0 -mr-16 -mt-16 w-64 h-64 rounded-full bg-white/10 blur-3xl"></div>
        <div class="absolute bottom-0 left-0 -ml-16 -mb-16 w-48 h-48 rounded-full bg-blue-700/50 blur-2xl"></div>
    </div>

    <!-- Bottom Section -->
    <div class="bg-white rounded-t-[40px] -mt-10 px-8 pt-10 pb-8 flex-1 flex flex-col relative z-20 shadow-[0_-8px_30px_rgba(0,0,0,0.1)]">
        
        <div class="mb-8">
            <h2 class="text-3xl font-black text-[#0F172A]">Welcome Back!</h2>
            <p class="text-[#64748B] text-sm mt-2">Please login to continue</p>
        </div>

        <form class="flex flex-col flex-1" onsubmit="event.preventDefault();">
            <!-- Phone Input -->
            <div class="mb-5">
                <label class="block font-semibold text-sm text-[#0F172A] mb-2">Phone Number</label>
                <div class="flex gap-3">
                    <div class="border border-[#E2E8F0] rounded-xl px-4 py-3 bg-[#F8FAFC] text-[#0F172A] font-semibold w-16 flex items-center justify-center shrink-0">
                        +63
                    </div>
                    <input type="tel" placeholder="912 345 6789" class="border border-[#E2E8F0] rounded-xl px-4 py-3 flex-1 bg-[#F8FAFC] text-[#0F172A] font-medium placeholder-[#64748B] focus:outline-none focus:border-[#2563EB] focus:ring-1 focus:ring-[#2563EB] transition-all">
                </div>
            </div>

            <!-- Password Input -->
            <div class="mb-5">
                <label class="block font-semibold text-sm text-[#0F172A] mb-2">Password</label>
                <div class="relative">
                    <input type="password" value="••••••••" class="border border-[#E2E8F0] rounded-xl px-4 py-3 w-full bg-[#F8FAFC] text-[#0F172A] font-medium focus:outline-none focus:border-[#2563EB] focus:ring-1 focus:ring-[#2563EB] transition-all tracking-widest pr-12">
                    <button type="button" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-[#64748B] hover:text-[#0F172A] focus:outline-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Remember & Forgot -->
            <div class="flex items-center justify-between mb-8">
                <label class="flex items-center gap-2 cursor-pointer group">
                    <div class="relative flex items-center justify-center">
                        <input type="checkbox" class="peer appearance-none w-5 h-5 border-2 border-[#E2E8F0] rounded bg-[#F8FAFC] checked:bg-[#2563EB] checked:border-[#2563EB] transition-colors cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" class="absolute w-3.5 h-3.5 text-white pointer-events-none opacity-0 peer-checked:opacity-100 transition-opacity" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <span class="text-sm font-medium text-[#64748B] group-hover:text-[#0F172A] transition-colors">Remember Me</span>
                </label>
                <a href="#" class="text-[#2563EB] font-medium text-sm hover:underline">Forgot password?</a>
            </div>

            <div class="mt-auto">
                <!-- Login Button -->
                <button type="submit" class="bg-[#2563EB] text-white w-full rounded-xl py-4 font-bold text-lg shadow-[0_8px_20px_-4px_rgba(37,99,235,0.4)] hover:bg-blue-700 hover:shadow-lg transition-all active:scale-[0.98]">
                    Login
                </button>
                
                <!-- Register Link -->
                <p class="text-center text-sm text-[#64748B] mt-6">
                    Don't have an account? <a href="#" class="text-[#2563EB] font-semibold hover:underline ml-1">Register</a>
                </p>
            </div>
        </form>
    </div>
</div>

</body>
</html>
