<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Start Ride</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-200">
    <div class="max-w-[400px] mx-auto min-h-screen bg-slate-50 shadow-2xl relative overflow-hidden flex flex-col">
        
        <!-- Top map section -->
        <div class="bg-gradient-to-b from-cyan-50 to-emerald-50 flex-1 relative min-h-[300px]">
            <!-- Floating Distance Card -->
            <div class="bg-white rounded-2xl shadow-lg px-6 py-4 absolute top-8 left-1/2 -translate-x-1/2 text-center w-max">
                <div class="text-3xl font-black text-blue-600">3.2 km</div>
                <div class="text-slate-500 text-sm font-medium">to destination</div>
            </div>

            <!-- Map path visualization -->
            <div class="absolute inset-0 flex items-center justify-center p-12">
                <div class="w-full h-full relative">
                    <!-- Dashed line -->
                    <svg class="absolute inset-0 w-full h-full" preserveAspectRatio="none">
                        <line x1="20%" y1="20%" x2="80%" y2="80%" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6,6" />
                    </svg>
                    <!-- Red pin circle top-left -->
                    <div class="absolute top-[20%] left-[20%] w-10 h-10 bg-red-500 rounded-full flex items-center justify-center shadow-lg -translate-x-1/2 -translate-y-1/2 z-10 border-4 border-white text-white">
                        📍
                    </div>
                    <!-- Yellow trike circle bottom-right -->
                    <div class="absolute top-[80%] left-[80%] w-12 h-12 bg-yellow-400 rounded-full flex items-center justify-center shadow-lg -translate-x-1/2 -translate-y-1/2 z-10 border-4 border-white text-xl">
                        🛺
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom sheet -->
        <div class="bg-white rounded-t-[32px] px-6 pt-5 pb-8 shadow-2xl relative -mt-4 z-10">
            <!-- Drag handle -->
            <div class="w-12 h-1.5 bg-slate-300 rounded-full mx-auto mb-6"></div>
            
            <!-- Passenger Info Card -->
            <div class="bg-fuchsia-50 rounded-2xl p-5 flex items-center gap-4">
                <!-- Avatar -->
                <div class="w-14 h-14 bg-blue-500 rounded-full flex items-center justify-center text-white text-2xl shrink-0">
                    👤
                </div>
                <!-- Column -->
                <div class="flex flex-col">
                    <div class="font-bold text-lg text-slate-900">Maria Santos</div>
                    <div class="text-slate-500 text-sm">1 passenger &middot; On board</div>
                    <div class="text-slate-500 text-sm">Going to: Ayala Center Cebu</div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-3 mt-4">
                <button class="bg-blue-500 text-white rounded-xl py-3.5 flex items-center justify-center gap-2 font-semibold shadow-md shadow-blue-200">
                    📞 Call
                </button>
                <button class="bg-emerald-500 text-white rounded-xl py-3.5 flex items-center justify-center gap-2 font-semibold shadow-md shadow-emerald-200">
                    💬 Text
                </button>
            </div>

            <!-- Fare Card -->
            <div class="bg-emerald-50/50 rounded-2xl p-5 mt-4 text-center border border-emerald-100">
                <div class="text-sm text-slate-500 font-medium">Trip Fare</div>
                <div class="text-5xl font-black text-emerald-600 tracking-tight mt-1">₱47</div>
            </div>

            <!-- Start Ride Button -->
            <button class="bg-orange-600 text-white w-full rounded-2xl py-4 font-bold text-xl mt-4 shadow-lg shadow-orange-200 flex items-center justify-center gap-2">
                ▶ Start Ride
            </button>

            <!-- Step text -->
            <div class="text-center text-slate-500 text-xs mt-6">
                Step 2 of 3: Passenger on board, ready to start
            </div>
        </div>

    </div>
</body>
</html>
