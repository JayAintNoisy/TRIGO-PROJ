<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Ride Complete</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="max-w-[400px] w-full mx-auto min-h-screen bg-slate-50 shadow-2xl relative overflow-hidden flex flex-col">
    <!-- Top map section -->
    <div class="bg-gradient-to-b from-blue-50 to-emerald-50 flex-1 relative min-h-[300px]">
        <!-- Floating Distance Card -->
        <div class="bg-white rounded-2xl shadow-lg px-6 py-4 absolute top-8 left-1/2 -translate-x-1/2 text-center w-max">
            <div class="text-3xl font-black text-emerald-600">0.2 km</div>
            <div class="text-slate-500 text-sm font-medium">Almost there!</div>
        </div>
    </div>

    <!-- Bottom sheet -->
    <div class="bg-white rounded-t-[32px] px-6 pt-5 pb-8 shadow-2xl relative -mt-4 z-10 flex-shrink-0">
        <!-- Drag handle -->
        <div class="w-12 h-1.5 bg-slate-300 rounded-full mx-auto mb-6"></div>
        
        <!-- Passenger Info Card -->
        <div class="bg-fuchsia-50/50 rounded-2xl p-5 flex items-center gap-4">
            <div class="w-14 h-14 bg-blue-500 rounded-full flex items-center justify-center text-white text-2xl shrink-0">
                👤
            </div>
            <div class="flex flex-col">
                <div class="font-bold text-lg text-slate-900">Maria Santos</div>
                <div class="text-slate-500 text-sm">1 passenger</div>
                <div class="text-slate-500 text-sm">Arriving at: Ayala Center Cebu</div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-2 gap-3 mt-4">
            <button class="bg-blue-500 text-white rounded-xl py-3.5 flex items-center justify-center gap-2 font-semibold shadow-md shadow-blue-200">
                <span>📞</span> Call
            </button>
            <button class="bg-emerald-500 text-white rounded-xl py-3.5 flex items-center justify-center gap-2 font-semibold shadow-md shadow-emerald-200">
                <span>💬</span> Text
            </button>
        </div>

        <!-- Fare Card -->
        <div class="bg-emerald-50/50 rounded-2xl p-5 mt-4 text-center border border-emerald-100">
            <div class="text-sm text-slate-500 font-medium">Trip Fare</div>
            <div class="text-5xl font-black text-emerald-600 tracking-tight mt-1">₱47</div>
        </div>

        <!-- Ride Complete Button -->
        <button class="bg-emerald-600 text-white w-full rounded-2xl py-[18px] font-bold text-xl mt-4 shadow-lg shadow-emerald-200 flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Ride Complete
        </button>

        <!-- Step indicator -->
        <div class="text-center text-slate-500 text-xs mt-6">
            Step 3 of 3: Arriving at destination
        </div>
    </div>
</div>

</body>
</html>
