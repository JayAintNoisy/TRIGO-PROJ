<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver New Ride Request</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f1f5f9;
        }
    </style>
</head>
<body>
    <div class="max-w-[400px] mx-auto min-h-screen bg-slate-500 shadow-2xl relative overflow-hidden flex flex-col justify-end">
        <!-- Timer -->
        <div class="w-16 h-16 bg-red-500 rounded-full shadow-lg flex items-center justify-center text-white text-2xl font-bold border-4 border-white/20 absolute top-8 right-6">
            15
        </div>

        <!-- Bottom Sheet -->
        <div class="bg-white rounded-t-[32px] px-6 pt-5 pb-8 shadow-[0_-10px_40px_rgba(0,0,0,0.1)] relative mt-auto">
            <!-- Drag Handle -->
            <div class="w-12 h-1.5 bg-slate-300 rounded-full mx-auto absolute top-3 left-1/2 -translate-x-1/2"></div>
            
            <!-- Top Avatar -->
            <div class="w-16 h-16 bg-blue-500 rounded-full border-4 border-white flex items-center justify-center text-white text-3xl shadow-md absolute -top-8 left-1/2 -translate-x-1/2">
                👤
            </div>

            <h1 class="text-2xl font-black text-slate-900 text-center mt-10">New Ride Request!</h1>

            <!-- Green Fare Card -->
            <div class="bg-emerald-600 rounded-2xl p-6 text-center mt-5 shadow-lg shadow-emerald-200 text-white">
                <div class="text-sm text-emerald-100 font-medium">You will earn</div>
                <div class="text-6xl font-black tracking-tight mt-1">₱47</div>
            </div>

            <!-- Stats Row -->
            <div class="grid grid-cols-2 gap-3 mt-4">
                <!-- Distance -->
                <div class="bg-blue-50 rounded-2xl p-4">
                    <div class="flex items-center gap-1 text-slate-500 text-xs">
                        <svg class="w-3 h-3 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        Distance
                    </div>
                    <div class="text-blue-600 font-bold text-xl mt-1">3.2 km</div>
                </div>
                <!-- Passengers -->
                <div class="bg-fuchsia-50 rounded-2xl p-4">
                    <div class="flex items-center gap-1 text-slate-500 text-xs">
                        <svg class="w-3 h-3 text-fuchsia-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        Passengers
                    </div>
                    <div class="text-fuchsia-600 font-bold text-xl mt-1">1 person</div>
                </div>
            </div>

            <!-- Ride Details Card -->
            <div class="bg-slate-50 rounded-2xl p-5 mt-4">
                <div class="font-bold text-slate-900">Passenger: Maria Santos</div>
                <div class="text-sm text-slate-500 mt-2">Pickup: SM City Cebu, North Reclamation Area</div>
                <div class="text-sm text-slate-500 mt-1">Destination: Ayala Center Cebu, Cebu Business Park</div>
            </div>

            <!-- Accept Button -->
            <button class="bg-emerald-600 text-white w-full rounded-2xl py-[18px] font-bold text-lg mt-4 shadow-lg shadow-emerald-200 flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                ACCEPT RIDE
            </button>

            <!-- Decline Button -->
            <button class="text-center text-slate-600 font-semibold mt-4 block w-full">
                Decline
            </button>
        </div>
    </div>
</body>
</html>
