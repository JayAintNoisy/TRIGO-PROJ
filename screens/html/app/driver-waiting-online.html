<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 flex justify-center">
    <div class="w-full max-w-[400px] mx-auto min-h-screen bg-white shadow-2xl relative overflow-hidden flex flex-col">
        <!-- Map Background -->
        <div class="flex-1 bg-gradient-to-b from-emerald-50/50 to-green-50/30 relative flex items-center justify-center">
            
            <!-- Map Simulation Lines -->
            <div class="absolute inset-0 opacity-20" style="background-image: linear-gradient(#93c5fd 1px, transparent 1px), linear-gradient(90deg, #93c5fd 1px, transparent 1px); background-size: 40px 40px;"></div>

            <!-- Notification Bell -->
            <div class="absolute top-4 right-4 z-30">
                <div class="w-14 h-14 bg-blue-600 rounded-full flex items-center justify-center shadow-lg relative">
                    <span class="text-white text-2xl">🔔</span>
                    <div class="w-5 h-5 bg-red-500 rounded-full absolute -top-1 -right-1 text-white text-xs font-bold flex items-center justify-center shadow-sm">1</div>
                </div>
            </div>

            <!-- Top Status Card -->
            <div class="absolute top-4 left-4 right-4 max-w-[calc(100%-80px)] z-30">
                <div class="bg-white rounded-2xl shadow-lg p-4">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex items-center gap-2">
                            <span class="text-emerald-500 text-xl">✈</span>
                            <h2 class="font-bold text-lg text-slate-800">You are Online</h2>
                        </div>
                        <div class="flex items-center gap-1">
                            <div class="w-2 h-2 bg-emerald-500 rounded-full"></div>
                            <span class="text-emerald-600 text-sm font-medium">Active</span>
                        </div>
                    </div>
                    <button class="bg-emerald-500 hover:bg-emerald-600 transition-colors text-white w-full rounded-xl py-4 font-bold text-lg flex items-center justify-center gap-2">
                        <span class="text-xl">✕</span> Go Offline
                    </button>
                </div>
            </div>

            <!-- Map Area Content -->
            <!-- Center Tricycle -->
            <div class="relative flex flex-col items-center justify-center z-10">
                <div class="w-48 h-48 bg-emerald-200/30 rounded-full absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
                <div class="w-20 h-20 bg-yellow-400 rounded-full flex items-center justify-center text-4xl shadow-lg z-10 relative">
                    🛺
                </div>
                <div class="bg-emerald-500 text-white text-xs px-3 py-1 rounded-full mt-2 z-10 shadow border border-emerald-400">
                    You
                </div>
            </div>

            <!-- Passenger Markers -->
            <!-- Marker 1 -->
            <div class="absolute top-48 left-8 flex flex-col items-center z-10">
                <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center shadow-lg text-white">👤</div>
                <div class="bg-white rounded-full px-2 py-0.5 text-blue-600 text-xs font-semibold shadow mt-1">0.3 km</div>
            </div>
            <!-- Marker 2 -->
            <div class="absolute top-1/3 right-8 flex flex-col items-center z-10">
                <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center shadow-lg text-white">👤</div>
                <div class="bg-white rounded-full px-2 py-0.5 text-blue-600 text-xs font-semibold shadow mt-1">0.7 km</div>
            </div>
            <!-- Marker 3 -->
            <div class="absolute bottom-1/3 left-12 flex flex-col items-center z-10">
                <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center shadow-lg text-white">👤</div>
                <div class="bg-white rounded-full px-2 py-0.5 text-blue-600 text-xs font-semibold shadow mt-1">1.1 km</div>
            </div>

            <!-- Bottom Card -->
            <div class="absolute bottom-6 left-4 right-4 bg-white rounded-2xl shadow-lg p-5 z-30">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-emerald-100 rounded-full flex items-center justify-center text-2xl flex-shrink-0">
                        📡
                    </div>
                    <div class="flex flex-col">
                        <h3 class="font-bold text-lg text-slate-800 leading-tight">Waiting for passengers...</h3>
                        <p class="text-emerald-600 text-sm font-medium mt-1">3 nearby passengers detected</p>
                    </div>
                </div>
                
                <div class="grid grid-cols-3 gap-3 mt-5">
                    <div class="bg-blue-50 rounded-xl py-3 text-center flex flex-col items-center justify-center">
                        <span class="text-2xl font-bold text-blue-600">12</span>
                        <span class="text-xs text-slate-500 font-medium">Trips</span>
                    </div>
                    <div class="bg-emerald-50 rounded-xl py-3 text-center flex flex-col items-center justify-center">
                        <span class="text-2xl font-bold text-emerald-600">₱450</span>
                        <span class="text-xs text-slate-500 font-medium">Earned</span>
                    </div>
                    <div class="bg-amber-50 rounded-xl py-3 text-center flex flex-col items-center justify-center">
                        <span class="text-2xl font-bold text-amber-600">4.9</span>
                        <span class="text-xs text-slate-500 font-medium">Rating</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom Nav Bar -->
        <div class="bg-white border-t border-slate-200 flex justify-around py-3 z-40 px-2 pb-5">
            <button class="flex flex-col items-center gap-1 w-16">
                <span class="text-xl">🏠</span>
                <span class="text-[10px] font-semibold text-emerald-500">Home</span>
            </button>
            <button class="flex flex-col items-center gap-1 w-16 opacity-50">
                <span class="text-xl grayscale">💲</span>
                <span class="text-[10px] font-medium text-slate-500">Earnings</span>
            </button>
            <button class="flex flex-col items-center gap-1 w-16 opacity-50">
                <span class="text-xl grayscale">👤</span>
                <span class="text-[10px] font-medium text-slate-500">Profile</span>
            </button>
        </div>
    </div>
</body>
</html>
