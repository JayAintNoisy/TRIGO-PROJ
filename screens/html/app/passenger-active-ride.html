<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Active Ride</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

<div class="max-w-[400px] w-full mx-auto min-h-screen bg-white shadow-2xl relative overflow-hidden flex flex-col">

    <!-- Top Map Section -->
    <div class="h-[40vh] bg-gradient-to-br from-emerald-50/40 to-cyan-50/30 relative flex-shrink-0">
        <!-- Connecting Line -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none" xmlns="http://www.w3.org/2000/svg">
            <line x1="25%" y1="35%" x2="65%" y2="70%" stroke="#2563EB" stroke-width="4" stroke-dasharray="10, 10" stroke-linecap="round" />
        </svg>

        <!-- Passenger Location (Green) -->
        <div class="absolute top-[35%] left-[25%] -translate-x-1/2 -translate-y-1/2">
            <div class="w-14 h-14 bg-emerald-500 rounded-full flex items-center justify-center shadow-lg relative z-10">
                <span class="text-white text-2xl" style="transform: rotate(-45deg);">✈</span>
            </div>
        </div>

        <!-- Driver / Tricycle (Yellow) -->
        <div class="absolute top-[70%] left-[65%] -translate-x-1/2 -translate-y-1/2">
            <div class="w-16 h-16 bg-yellow-400 rounded-full flex items-center justify-center shadow-lg relative z-10">
                <span class="text-3xl">🛺</span>
            </div>
        </div>

        <!-- Driver / Navigation (Red) -->
        <div class="absolute top-[65%] left-[80%] -translate-x-1/2 -translate-y-1/2">
            <div class="w-12 h-12 bg-red-500 rounded-full flex items-center justify-center shadow relative z-10">
                <span class="text-white text-xl" style="transform: rotate(135deg);">✈</span>
            </div>
        </div>
    </div>

    <!-- Bottom Sheet -->
    <div class="flex-1 bg-white rounded-t-[28px] shadow-[0_-10px_40px_rgba(0,0,0,0.1)] px-6 pt-6 pb-6 relative -mt-6 z-20 flex flex-col">
        <!-- Drag Handle -->
        <div class="w-12 h-1.5 bg-slate-300 rounded-full mx-auto mb-5"></div>
        
        <!-- Status Text -->
        <h2 class="text-xl font-black text-slate-900 text-center">Your driver is 3 minutes away</h2>
        <p class="text-slate-500 text-sm text-center mt-1">Mang Jose - ABC-1234</p>
        
        <!-- Divider -->
        <div class="border-t border-slate-200 my-5"></div>
        
        <!-- Action Buttons -->
        <div class="flex justify-center gap-6">
            <button class="w-[72px] h-[72px] bg-blue-500 rounded-full flex flex-col items-center justify-center shadow-lg text-white transition hover:bg-blue-600 active:scale-95">
                <span class="text-2xl mb-1">📞</span>
                <span class="text-xs font-semibold">Call</span>
            </button>
            <button class="w-[72px] h-[72px] bg-emerald-500 rounded-full flex flex-col items-center justify-center shadow-lg text-white transition hover:bg-emerald-600 active:scale-95">
                <span class="text-2xl mb-1">💬</span>
                <span class="text-xs font-semibold">Text</span>
            </button>
        </div>
        
        <!-- Divider -->
        <div class="border-t border-slate-200 my-5"></div>
        
        <!-- Info Cards -->
        <div class="grid grid-cols-2 gap-3 mb-auto">
            <div class="bg-blue-50 rounded-xl p-4">
                <div class="text-xs text-slate-500 font-medium mb-1">🕐 ETA</div>
                <div class="text-3xl font-black text-blue-700">8 min</div>
            </div>
            <div class="bg-emerald-50 rounded-xl p-4">
                <div class="text-xs text-slate-500 font-medium mb-1">💲 Fare</div>
                <div class="text-3xl font-black text-emerald-600">₱45</div>
            </div>
        </div>
        
        <!-- Action Button -->
        <button class="bg-blue-600 text-white w-full rounded-2xl py-4 font-bold text-lg mt-5 shadow-lg shadow-blue-200 transition hover:bg-blue-700 active:scale-95">
            Complete Ride
        </button>
    </div>

</div>

</body>
</html>
